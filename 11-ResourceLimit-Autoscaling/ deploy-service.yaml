apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-apache
  labels:
    env: demo
spec:
  selector:
    matchLabels:
      run: php-apache
  template:
    metadata:
      labels:
        run: php-apache
    spec:
      containers:
      - name: php-apache
        image: registry.k8s.io/hpa-example
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: 500m       # hard cap at 0.5 CPU core
          requests:
            cpu: 200m       # scheduler reserves 0.2 CPU core
---
apiVersion: v1
kind: Service
metadata:
  name: php-apache
  labels:
    run: php-apache
spec:
  ports:
  - port: 80
  selector:
    run: php-apache