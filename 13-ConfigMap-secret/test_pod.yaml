apiVersion: v1
kind: Pod
metadata:
  name: myapp
  labels:
    name: myapp-pod
spec:
  containers:
  - name: myapp-containers
    image: busybox:1.28
    command: ['sh', '-c', 'echo the app is running!! && sleep 3600']

    # Way 1 — inject ALL keys from ConfigMap as env vars (recommended)
    envFrom:
    - configMapRef:
        name: app-cm

    # Way 2 — inject a SPECIFIC key from ConfigMap as an env var
    # env:
    # - name: FIRSTNAME
    #   valueFrom:
    #     configMapKeyRef:
    #       name: app-cm
    #       key: firstname